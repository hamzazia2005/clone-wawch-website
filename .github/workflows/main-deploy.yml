name: Website ECS Force Deploy (Latest)

on:
  push:
    branches:
      - main

env:
  # AWS configuration
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: 030598234754
  ECR_REPOSITORY: wawcd-website
  ECS_CLUSTER: wawcd-cluster
  ECS_SERVICE: wawcd-website-ecs

  # App environment variables
  WAWCD_URL: "https://wawcd.com/"
  STRAPI_BE_URL_SERVER: "https://strapi.wawcd.com"
  NEXT_PUBLIC_STRAPI_BE_URL_CLIENT: "https://strapi.wawcd.com"

  # Secrets / sensitive info directly in env
  STRAPI_ACCESS_TOKEN: "c44fe70b3c8342680fd60825863191531464e51d207ec0dce1acdc5f849ea485f546025fc837d56bb2064c45eab5034e141fad0cf931e83bd313e512c63ae3d8cc8f666e2c800b4dbf79c9a845c218feced45e6685b49460aaec0c96f34e52e861412f3b10f5ec2db2c7873c77bd725dcfc40e53e8d2e8875faaa9afeb9e8806"

  REDIS_URL: "redis://default:UQ9cudaIbvsvKSZ79sQf4EsgvY61DulM@redis-11282.fcrce171.ap-south-1-1.ec2.cloud.redislabs.com:11282"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          echo "Starting Docker build..."
          docker build \
            --build-arg WAWCD_URL="${{ env.WAWCD_URL }}" \
            --build-arg STRAPI_BE_URL_SERVER="${{ env.STRAPI_BE_URL_SERVER }}" \
            --build-arg NEXT_PUBLIC_STRAPI_BE_URL_CLIENT="${{ env.NEXT_PUBLIC_STRAPI_BE_URL_CLIENT }}" \
            --build-arg STRAPI_ACCESS_TOKEN="${{ env.STRAPI_ACCESS_TOKEN }}" \
            --build-arg REDIS_URL="${{ env.REDIS_URL }}" \
            -t ${{ env.ECR_REPOSITORY }}:latest .
          echo "Docker build completed."

      - name: Push Docker image to ECR
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

      - name: Update ECS service (forces new deployment)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
