name: Website ECS Force Deploy (Latest)

on:
  push:
    branches:
      - main

env:
  # AWS configuration
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: 30598234754
  ECR_REPOSITORY: wawcd-website
  ECS_CLUSTER: wawcd-cluster
  ECS_SERVICE: wawcd-website-ecs
  # environment variables
  WAWCD_URL: "https://wawcd.com/"
  STRAPI_BE_URL_SERVER: "https://strapi.wawcd.com"
  NEXT_PUBLIC_STRAPI_BE_URL_CLIENT: "https://strapi.wawcd.com"
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          echo "Successfully logged into ECR"

      - name: Build Docker image
        run: |
          echo "Starting Docker build..."
          docker build \
            --build-arg WAWCD_URL="${{ env.WAWCD_URL }}" \
            --build-arg STRAPI_BE_URL_SERVER="${{ env.STRAPI_BE_URL_SERVER }}" \
            --build-arg NEXT_PUBLIC_STRAPI_BE_URL_CLIENT="${{ env.NEXT_PUBLIC_STRAPI_BE_URL_CLIENT }}" \
            --build-arg STRAPI_ACCESS_TOKEN="${{ secrets.STRAPI_ACCESS_TOKEN }}" \
            --build-arg REDIS_URL="${{ secrets.REDIS_URL }}" \
            -t ${{ env.ECR_REPOSITORY }}:latest .
          echo "Docker build completed."

      - name: Push Docker image to ECR
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

      - name: Update ECS service (forces new deployment)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Logout from Amazon ECR
        if: always()
        run: |
          docker logout ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
